<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ログイン</title>
  <style>
    body {
      font-family: sans-serif;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      max-width: 500px;
      margin: auto;
    }
    input, button {
      display: block;
      width: 100%;
      margin-bottom: 15px;
      font-size: 16px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <h2>管理者ログイン</h2>
  <form method="post">
    <input type="password" name="password" placeholder="パスワード">
    <button type="submit">ログイン</button>
  </form>
</body>
</html>
