<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>オーラ鑑定フォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-size: 16px;
      padding: 10px;
      font-family: sans-serif;
      max-width: 600px;
      margin: auto;
      background: #f0f4f8;
    }
    h2 {
      text-align: center;
    }
    input, button, select {
      font-size: 16px;
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      box-sizing: border-box;
    }
    #video, #canvas {
      width: 100%;
      max-width: 400px;
      border: 1px solid #ccc;
      margin: 10px auto;
      display: block;
    }
    #preview {
      display: none;
      margin-top: 10px;
      max-width: 100%;
      border: 2px solid #666;
    }
  </style>
</head>
<body>
  <h2>📸 オーラ鑑定カメラフォーム</h2>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <button onclick="toggleCamera()">🔄 カメラ切替</button>
  <button onclick="takePhoto()">📷 撮影</button>

  <form id="auraForm" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="uuid" value="{{ uuid }}">
    <input type="hidden" name="image_data" id="image_data">
    <img id="preview" src="" alt="撮影画像プレビュー">
    <button type="submit">🔮 鑑定を送信</button>
  </form>

  <script>
    let video = document.getElementById("video");
    let canvas = document.getElementById("canvas");
    let imageDataInput = document.getElementById("image_data");
    let preview = document.getElementById("preview");
    let ctx = canvas.getContext("2d");
    let currentStream = null;
    let useFrontCamera = false;
    let currentFacingMode = "environment";
    let currentDeviceId = null;
    let videoDevices = [];
    let videoDevicesReady = null;

    function stopCurrentStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
    }

    async function refreshVideoDevices() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
      const devices = await navigator.mediaDevices.enumerateDevices();
      videoDevices = devices.filter(device => device.kind === "videoinput");
      return videoDevices;
    }

    function refreshVideoDevicesSoon() {
      if (!videoDevicesReady) {
        videoDevicesReady = refreshVideoDevices()
          .catch(() => [])
          .finally(() => { videoDevicesReady = null; });
      }
      return videoDevicesReady;
    }

    function pickEnvironmentCamera(devices) {
      if (!devices || devices.length === 0) return null;
      const rearPattern = /back|rear|environment|world|外|背面|アウト|後/i;
      return devices.find(device => rearPattern.test(device.label || "")) || devices[devices.length - 1];
    }

    async function initCamera(deviceId = null) {
      stopCurrentStream();

      try {
        const videoConstraint = deviceId
          ? { deviceId: { exact: deviceId } }
          : { facingMode: { ideal: currentFacingMode } };

        currentStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint });
        video.srcObject = currentStream;

        const activeTrack = currentStream.getVideoTracks()[0];
        const activeSettings = activeTrack && activeTrack.getSettings ? activeTrack.getSettings() : {};
        currentDeviceId = activeSettings.deviceId || deviceId || currentDeviceId;

        // enumerateDevices() はPCで遅くなることがあるため、起動を待たずに裏で更新する
        refreshVideoDevicesSoon();
      } catch (e) {
        alert("カメラにアクセスできません：" + e.message);
      }
    }

    async function toggleCamera() {
      try {
        let devices = videoDevices;
        if (devices.length < 2) {
          devices = await refreshVideoDevicesSoon();
        }

        if (devices.length >= 2) {
          const currentIndex = devices.findIndex(device => device.deviceId === currentDeviceId);
          const nextIndex = currentIndex >= 0 ? (currentIndex + 1) % devices.length : 0;
          await initCamera(devices[nextIndex].deviceId);
          return;
        }

        currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
        useFrontCamera = currentFacingMode === "user";
        await initCamera();
      } catch (e) {
        alert("カメラ切替に失敗しました：" + e.message);
      }
    }

    async function startPreferredCamera() {
      // 初回表示を優先して即起動。カメラ一覧は裏で取得し、切替時に deviceId を使う。
      await initCamera();
    }

    function takePhoto() {
      const width = 600;
      const height = video.videoHeight * (600 / video.videoWidth);
      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(video, 0, 0, width, height);
      const imageData = canvas.toDataURL("image/jpeg", 0.8);
      imageDataInput.value = imageData;

      // プレビュー表示
      preview.src = imageData;
      preview.style.display = "block";

      alert("📷 撮影完了しました！下の送信ボタンを押してください");
    }

    window.onload = () => {
      startPreferredCamera();
    };
  </script>
</body>
</html>
