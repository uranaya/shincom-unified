<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>手相鑑定フォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-size: 16px;
      padding: 10px;
      font-family: sans-serif;
      max-width: 600px;
      margin: auto;
    }
    input, button, select {
      font-size: 16px;
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      box-sizing: border-box;
    }
    #camera {
      width: 100%;
      max-width: 400px;
      max-height: 280px;
      border: 1px solid #ccc;
      object-fit: contain;
    }
    #canvas {
      width: 100%;
      max-width: 400px;
      border: 1px solid #ccc;
    }
    #eto-display, #zodiac-display {
      font-size: 16px;
      margin-top: 5px;
      margin-bottom: 10px;
      color: #444;
    }
    .wareki-group {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 10px;
    }
    .wareki-group input, .wareki-group select {
      width: 30%;
      padding: 8px;
    }
  
/* --- options (checkboxes) --- */
.form-options{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin:18px auto 22px;
  align-items:flex-start;
  max-width:520px;
}
.option{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:16px;
  line-height:1.4;
}
.option input{
  width:18px;
  height:18px;
}
@media (max-width: 600px){
  .form-options{max-width: 95%;}
  .option{font-size:15px;}
}
</style>

  <!-- 🔊 効果音（静的配信） -->
  <audio id="shutterSound" src="/static/shutter.mp3" preload="auto"></audio>
  <audio id="clickSound"   src="/static/click.mp3"   preload="auto"></audio>
  <audio id="chimeSound"   src="/static/chime.mp3"   preload="auto"></audio>
</head>
<body>
  <h2>📸 手相撮影＆送信フォーム</h2>
  <canvas id="canvas" style="display:none;"></canvas>
  <button onclick="toggleCamera()">🔄 カメラ切替</button>
  <button onclick="takePhoto()">📷 撮影</button>
  <video id="camera" autoplay playsinline></video>

  <label for="birthdate">生年月日（西暦）：</label>
  <input type="date" id="birthdate" required oninput="fetchEto()">
  <div id="eto-display"></div>
  <div id="zodiac-display"></div>

  <label>生年月日（和暦で入力）：</label>
  <div class="wareki-group">
    <select id="era">
      <option value="令和">令和</option>
      <option value="平成">平成</option>
      <option value="昭和">昭和</option>
    </select>
    <input type="number" id="era-year" placeholder="年" min="1">
    <input type="number" id="month" placeholder="月" min="1" max="12">
    <input type="number" id="day" placeholder="日" min="1" max="31">
  </div>
  <button onclick="convertWarekiToSeireki()">⬅ 和暦 → 西暦に反映</button>

  
<div class="form-options">
  <label class="option">
    <input type="checkbox" name="full_year" id="full_year" value="1">
    <span>1年分の運勢を出す（+2ページ）</span>
  </label>

  <label class="option">
    <input type="checkbox" name="force_next_month" id="force_next_month" value="1">
    <span>来月・再来月を占う（20日以前でも来月起点にする）</span>
  </label>

  <label class="option">
    <input type="checkbox" name="tokyo_mode" id="tokyo_mode" value="1">
    <span>東京（浅草）向けの文章にする</span>
  </label>

  <label class="option">
    <input type="checkbox" name="english_output" id="english_output" value="1">
    <span>English output</span>
  </label>
</div>

<button id="submitBtn" onclick="submitForm()">送信してPDF生成</button>
  <a href="/renai" style="display:block; text-align:center; margin:10px 0;">💘 恋愛占いはこちら</a>
  <form action="/logout"><button>ログアウト</button></form>

  <script>
    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let currentFacingMode = "environment";
    let stream = null;

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
        video.srcObject = stream;
      } catch (e) {
        alert("カメラが使用できません：" + e.message);
      }
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
      startCamera();
    }

    // 🔊 撮影時：シャッター音
    function takePhoto() {
      const shutter = document.getElementById("shutterSound");
      if (shutter) {
        try {
          shutter.currentTime = 0;
          const p = shutter.play();
          if (p && typeof p.then === "function") p.catch(()=>{});
        } catch (_) {}
      }

      const width = 600;
      const height = video.videoHeight * (600 / video.videoWidth);
      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(video, 0, 0, width, height);
      canvas.style.display = "block";
      alert("📷 撮影完了しました！");
    }

    function convertWarekiToSeireki() {
      const era = document.getElementById("era").value;
      const eraYear = parseInt(document.getElementById("era-year").value);
      const month = parseInt(document.getElementById("month").value);
      const day = parseInt(document.getElementById("day").value);

      if (!eraYear || !month || !day) {
        alert("和暦の年・月・日をすべて入力してください。");
        return;
      }

      let offset = 0;
      if (era === "令和") offset = 2018;
      else if (era === "平成") offset = 1988;
      else if (era === "昭和") offset = 1925;

      const year = offset + eraYear;
      const formatted = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      document.getElementById("birthdate").value = formatted;
      fetchEto();
    }

    function getZodiacSign(month, day) {
      if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return "牡羊座";
      if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return "牡牛座";
      if ((month === 5 && day >= 21) || (month === 6 && day <= 21)) return "双子座";
      if ((month === 6 && day >= 22) || (month === 7 && day <= 22)) return "蟹座";
      if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return "獅子座";
      if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return "乙女座";
      if ((month === 9 && day >= 23) || (month === 10 && day <= 23)) return "天秤座";
      if ((month === 10 && day >= 24) || (month === 11 && day <= 22)) return "蠍座";
      if ((month === 11 && day >= 23) || (month === 12 && day <= 21)) return "射手座";
      if ((month === 12 && day >= 22) || (month === 1 && day <= 20)) return "山羊座";
      if ((month === 1 && day >= 21) || (month === 2 && day <= 18)) return "水瓶座";
      if ((month === 2 && day >= 19) || (month === 3 && day <= 20)) return "魚座";
      return "";
    }

    function getCurrentYearEtoAccurate() {
      const now = new Date();
      const year = now.getFullYear();
      const springStart = new Date(`${year}-02-04`);
      const eto60keys = Object.keys({
        "甲子":1,"乙丑":2,"丙寅":3,"丁卯":4,"戊辰":5,"己巳":6,"庚午":7,"辛未":8,"壬申":9,"癸酉":10,
        "甲戌":11,"乙亥":12,"丙子":13,"丁丑":14,"戊寅":15,"己卯":16,"庚辰":17,"辛巳":18,"壬午":19,"癸未":20,
        "甲申":21,"乙酉":22,"丙戌":23,"丁亥":24,"戊子":25,"己丑":26,"庚寅":27,"辛卯":28,"壬辰":29,"癸巳":30,
        "甲午":31,"乙未":32,"丙申":33,"丁酉":34,"戊戌":35,"己亥":36,"庚子":37,"辛丑":38,"壬寅":39,"癸卯":40,
        "甲辰":41,"乙巳":42,"丙午":43,"丁未":44,"戊申":45,"己酉":46,"庚戌":47,"辛亥":48,"壬子":49,"癸丑":50,
        "甲寅":51,"乙卯":52,"丙辰":53,"丁巳":54,"戊午":55,"己未":56,"庚申":57,"辛酉":58,"壬戌":59,"癸亥":60
      });
      const baseYear = 1984; // 甲子
      const etoIndex = ((now < springStart ? year - 1 : year) - baseYear) % 60;
      return eto60keys[etoIndex];
    }

    function getTenchusatsuStatus(nicchuEto, currentYearEto) {
      const tenchusatsuMap = {
        "甲子": ["戌", "亥"], "乙丑": ["戌", "亥"], "丙寅": ["申", "酉"], "丁卯": ["申", "酉"],
        "戊辰": ["午", "未"], "己巳": ["午", "未"], "庚午": ["辰", "巳"], "辛未": ["辰", "巳"],
        "壬申": ["寅", "卯"], "癸酉": ["寅", "卯"], "甲戌": ["子", "丑"], "乙亥": ["子", "丑"],
        "丙子": ["戌", "亥"], "丁丑": ["戌", "亥"], "戊寅": ["申", "酉"], "己卯": ["申", "酉"],
        "庚辰": ["午", "未"], "辛巳": ["午", "未"], "壬午": ["辰", "巳"], "癸未": ["辰", "巳"],
        "甲申": ["寅", "卯"], "乙酉": ["寅", "卯"], "丙戌": ["子", "丑"], "丁亥": ["子", "丑"],
        "戊子": ["戌", "亥"], "己丑": ["戌", "亥"], "庚寅": ["申", "酉"], "辛卯": ["申", "酉"],
        "壬辰": ["午", "未"], "癸巳": ["午", "未"], "甲午": ["辰", "巳"], "乙未": ["辰", "巳"],
        "丙申": ["寅", "卯"], "丁酉": ["寅", "卯"], "戊戌": ["子", "丑"], "己亥": ["子", "丑"],
        "庚子": ["戌", "亥"], "辛丑": ["戌", "亥"], "壬寅": ["申", "酉"], "癸卯": ["申", "酉"],
        "甲辰": ["午", "未"], "乙巳": ["午", "未"], "丙午": ["辰", "巳"], "丁未": ["辰", "巳"],
        "戊申": ["寅", "卯"], "己酉": ["寅", "卯"], "庚戌": ["子", "丑"], "辛亥": ["子", "丑"],
        "壬子": ["戌", "亥"], "癸丑": ["戌", "亥"], "甲寅": ["申", "酉"], "乙卯": ["申", "酉"],
        "丙辰": ["午", "未"], "丁巳": ["午", "未"], "戊午": ["辰", "巳"], "己未": ["辰", "巳"],
        "庚申": ["寅", "卯"], "辛酉": ["寅", "卯"], "壬戌": ["子", "丑"], "癸亥": ["子", "丑"]
      };

      const currentYearChishi = currentYearEto.slice(1);
      const tcs = tenchusatsuMap[nicchuEto];
      if (tcs && tcs.includes(currentYearChishi)) {
        return `🌑 今年は天中殺の年です（${tcs.join("・")}）`;
      } else {
        return "☀️ 今年は天中殺ではありません";
      }
    }

    async function fetchEto() {
      const birthdate = document.getElementById("birthdate").value;
      const etoDisplay = document.getElementById("eto-display");
      const zodiacDisplay = document.getElementById("zodiac-display");

      if (!birthdate) {
        etoDisplay.textContent = "";
        zodiacDisplay.textContent = "";
        return;
      }

      // 星座計算
      const [year, month, day] = birthdate.split("-").map(Number);
      const zodiac = getZodiacSign(month, day);
      zodiacDisplay.textContent = `あなたの星座：${zodiac}`;

      // 干支・動物・本命星表示（既存のまま）
      try {
        const response = await fetch("/get_eto", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ birthdate })
        });
        const data = await response.json();
        if (!response.ok) {
          etoDisplay.textContent = `⚠️ エラー: ${data.error || '不明なエラー'}`;
          return;
        }
        if (data.eto && data.honmeisei) {
          const etoOrderMap = {"甲子":1,"乙丑":2,"丙寅":3,"丁卯":4,"戊辰":5,"己巳":6,"庚午":7,"辛未":8,"壬申":9,"癸酉":10,"甲戌":11,"乙亥":12,"丙子":13,"丁丑":14,"戊寅":15,"己卯":16,"庚辰":17,"辛巳":18,"壬午":19,"癸未":20,"甲申":21,"乙酉":22,"丙戌":23,"丁亥":24,"戊子":25,"己丑":26,"庚寅":27,"辛卯":28,"壬辰":29,"癸巳":30,"甲午":31,"乙未":32,"丙申":33,"丁酉":34,"戊戌":35,"己亥":36,"庚子":37,"辛丑":38,"壬寅":39,"癸卯":40,"甲辰":41,"乙巳":42,"丙午":43,"丁未":44,"戊申":45,"己酉":46,"庚戌":47,"辛亥":48,"壬子":49,"癸丑":50,"甲寅":51,"乙卯":52,"丙辰":53,"丁巳":54,"戊午":55,"己未":56,"庚申":57,"辛酉":58,"壬戌":59,"癸亥":60};
          const animal60 = [
            "長距離ランナーのチータ", "社交家のたぬき", "落ち着きのない猿", "フットワークの軽い子守熊", "面倒見のいい黒ひょう",
            "愛情あふれる虎", "全力疾走するチータ", "磨き上げられたたぬき", "大きな志をもった猿", "母性豊かな子守熊",
            "正直なこじか", "人気者のゾウ", "ネアカの狼", "協調性のないひつじ", "どっしりとした猿", "コアラのなかの子守熊",
            "強い意志をもったこじか", "デリケートなゾウ", "放浪の狼", "物静かなひつじ", "落ち着きのあるペガサス",
            "強靭な翼をもつペガサス", "無邪気なひつじ", "クリエイティブな狼", "穏やかな狼", "粘り強いひつじ",
            "波乱に満ちたペガサス", "優雅なペガサス", "チャレンジ精神旺盛なひつじ", "順応性のある狼",
            "リーダーとなるゾウ", "しっかり者のこじか", "活動的な子守熊", "気分屋の猿", "頼られると嬉しいひつじ",
            "好感のもたれる狼", "まっしぐらに突き進むゾウ", "華やかなこじか", "夢とロマンの子守熊", "尽す猿",
            "大器晩成のたぬき", "足腰の強いチータ", "動きまわる虎", "情熱的な黒ひょう", "サービス精神旺盛な子守熊",
            "守りの猿", "人間味あふれるたぬき", "品格のあるチータ", "ゆったりとした悠然の虎", "落ち込みの激しい黒ひょう",
            "我が道を行くライオン", "統率力のあるライオン", "感情豊かな黒ひょう", "楽天的な虎", "パワフルな虎",
            "気どらない黒ひょう", "感情的なライオン", "傷つきやすいライオン", "束縛を嫌う黒ひょう", "慈悲深い虎"
          ];

          const number = etoOrderMap[data.eto];
          const animal = animal60[number - 1];

          const currentYearEto = getCurrentYearEtoAccurate();
          const tenchusatsu = getTenchusatsuStatus(data.eto, currentYearEto);

          etoDisplay.textContent = `あなたの干支：${data.eto}（${number}番）／ 動物占い：${animal} ／ 本命星：${data.honmeisei}`;
        } else {
          etoDisplay.textContent = "⚠️ 情報の取得に失敗しました";
        }
      } catch (error) {
        etoDisplay.textContent = "⚠️ 通信エラー: " + error.message;
      }
    }

    // 🔊 送信時：クリック音 → PDF生成処理 → 完了時：チャイム → リダイレクト
    async function submitForm() {
      // 送信ボタンクリック音
      const click = document.getElementById("clickSound");
      if (click) {
        try {
          click.currentTime = 0;
          const p = click.play();
          if (p && typeof p.then === "function") p.catch(()=>{});
        } catch (_) {}
      }

      const birthdate = document.getElementById("birthdate").value;
      const imageData = canvas.toDataURL("image/png");
      const fullYear = document.getElementById("full_year").checked;
      const path = window.location.pathname;

      if (!birthdate || !imageData) {
        alert("生年月日と手相画像の両方を入力してください。");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "鑑定中... 1分程度お待ちください";

      const forceNextMonth = document.getElementById("force_next_month")?.checked || false;

      const tokyoMode = document.getElementById("tokyo_mode")?.checked || false;
      const englishOutput = document.getElementById("english_output")?.checked || false;
      const outputLang = englishOutput ? "en" : "ja";

      const payload = { image_data: imageData, birthdate, full_year: fullYear, force_next_month: forceNextMonth,
                        tokyo_mode: tokyoMode, english_output: englishOutput, output_lang: outputLang };

      try {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        let result;
        const ct = response.headers.get("content-type") || "";
        if (!ct.includes("application/json")) {
          const txt = await response.text();
          throw new Error(`サーバーがJSONを返しませんでした (HTTP ${response.status}). ` + txt.slice(0, 200));
        }
        result = await response.json();
        if (result.redirect_url) {
          // 完了チャイム（短時間待ってから遷移）
          const chime = document.getElementById("chimeSound");
          try {
            chime.currentTime = 0;
            const playPromise = chime.play();
            if (playPromise && typeof playPromise.then === "function") {
              await Promise.race([
                playPromise.catch(()=>{}),
                new Promise(res => setTimeout(res, 700))
              ]);
            }
          } catch (_) {}
          window.location.href = result.redirect_url;
        } else {
          alert("PDF生成後のリダイレクトが取得できませんでした");
        }
      } catch (error) {
        alert("送信エラー: " + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "送信してPDF生成";
      }
    }

    window.onload = startCamera;
  </script>
