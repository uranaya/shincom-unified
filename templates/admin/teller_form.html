<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% if mode == "new" %}占い師 新規登録{% else %}占い師 編集{% endif %}</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;margin:16px;}
    .wrap{max-width:900px;margin:0 auto;}
    .card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0;}
    label{display:block;font-size:13px;margin:10px 0 6px;}
    input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;}
    textarea{min-height:120px;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .btn{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid #111;background:#111;color:#fff;text-decoration:none;}
    .btn2{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid #555;background:#fff;color:#111;text-decoration:none;}
    .muted{color:#666;font-size:13px;}
    .err{color:#b00020;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>{% if mode == "new" %}占い師 新規登録{% else %}占い師 編集{% endif %}</h1>
    <div class="muted">タグは「カンマ区切り」で入力します（例：恋愛, 仕事, 人間関係）。</div>

    {% if error %}
      <p class="err">{{ error }}</p>
    {% endif %}

    <div class="card">
      <form method="post">
        <div class="row">
          <div>
            <label>slug（必須・英数字推奨）</label>
            <input name="slug" value="{{ teller.slug if teller else '' }}" placeholder="hiromi" required/>

            <label>表示名（必須）</label>
            <input name="display_name" value="{{ teller.display_name if teller else '' }}" placeholder="HIROMI" required/>

            <label>並び順（小さいほど上）</label>
            <input name="sort_order" value="{{ teller.sort_order if teller else 100 }}" />

            <label>写真URL（任意）</label>
            <input name="photo_url" value="{{ teller.photo_url if teller else '' }}" placeholder="/static/img/tellers/hiromi.jpg" />
          </div>

          <div>
            <label>タグ（カンマ区切り）</label>
            <input name="tags" value="{{ teller.tags_csv if teller else '' }}" placeholder="恋愛, 仕事, 人間関係" />

            <label>紹介文（短文）</label>
            <textarea name="short_bio" placeholder="現状整理と次の一手を具体化する鑑定が得意です。">{{ teller.short_bio if teller else '' }}</textarea>


<div class="field">
  <label>長めの紹介文（long_bio）</label>
  <textarea name="long_bio" rows="10" placeholder="300〜800字程度で。">{{ teller.long_bio if teller else '' }}</textarea>
</div>

<div class="field grid-3">
  <div>
    <label>占術1（art1）</label>
    <input type="text" name="art1" value="{{ teller.art1 if teller else '' }}" placeholder="例：手相">
  </div>
  <div>
    <label>占術2（art2）</label>
    <input type="text" name="art2" value="{{ teller.art2 if teller else '' }}" placeholder="例：タロット">
  </div>
  <div>
    <label>占術3（art3）</label>
    <input type="text" name="art3" value="{{ teller.art3 if teller else '' }}" placeholder="例：四柱推命">
  </div>
</div>



            <label>公開</label>
            <div class="muted">
              <label><input type="checkbox" name="is_active" value="1" {% if teller and teller.is_active %}checked{% elif mode=="new" %}checked{% endif %}/> 公開する</label>
            </div>

            <label>受付</label>
            <div class="muted">
              <label><input type="checkbox" name="is_accepting" value="1" {% if teller and teller.is_accepting %}checked{% elif mode=="new" %}checked{% endif %}/> 受付する</label>
            </div>

            <hr style="margin:14px 0; border:none; border-top:1px solid #eee;" />

            <h3 style="margin:0 0 6px;">事務局用（非公開）</h3>
            <div class="muted" style="margin-bottom:8px;">※ここに入力した情報はお客様画面では表示しません。</div>

            <label>占い師メール（CC送信先にも使用）</label>
            <input name="admin_email" value="{{ teller.admin_email if teller else '' }}" placeholder="example@domain.com" />

            <label>占い師電話番号</label>
            <input name="admin_phone" value="{{ teller.admin_phone if teller else '' }}" placeholder="090-xxxx-xxxx" />

            <label>予約通知CCメール（任意：未入力なら占い師メールを使用）</label>
            <input name="notify_email" value="{{ teller.notify_email if teller else '' }}" placeholder="cc@domain.com" />

            <div class="row">
              <div>
                <label>振込先：銀行名</label>
                <input name="bank_name" value="{{ teller.bank_name if teller else '' }}" placeholder="○○銀行" />
              </div>
              <div>
                <label>支店名</label>
                <input name="bank_branch" value="{{ teller.bank_branch if teller else '' }}" placeholder="△△支店" />
              </div>
            </div>

            <div class="row">
              <div>
                <label>口座種別</label>
                <input name="bank_account_type" value="{{ teller.bank_account_type if teller else '' }}" placeholder="普通 / 当座" />
              </div>
              <div>
                <label>口座番号</label>
                <input name="bank_account_number" value="{{ teller.bank_account_number if teller else '' }}" placeholder="1234567" />
              </div>
            </div>

            <label>口座名義（カナ）</label>
            <input name="bank_account_holder" value="{{ teller.bank_account_holder if teller else '' }}" placeholder="ヤマダ タロウ" />

            <hr style="margin:14px 0; border:none; border-top:1px solid #eee;" />

            <h3 style="margin:0 0 6px;">対応可能メニュー（お客様向け）</h3>
            <div class="muted" style="margin-bottom:8px;">予約フォームの「鑑定メニュー」を、占い師ごとに出し分けします。</div>

            <div class="muted" style="display:grid; gap:6px;">
              <label><input type="checkbox" name="menu_video_call" value="1" {% if teller and teller.menu_video_call %}checked{% elif mode=="new" %}checked{% endif %}/> ビデオ通話（30分）</label>
              <label><input type="checkbox" name="menu_phone_call" value="1" {% if teller and teller.menu_phone_call %}checked{% elif mode=="new" %}checked{% endif %}/> 通話（30分）</label>
              <label><input type="checkbox" name="menu_video" value="1" {% if teller and teller.menu_video %}checked{% elif mode=="new" %}checked{% endif %}/> 鑑定動画（後日送付）</label>
              <label><input type="checkbox" name="menu_pdf" value="1" {% if teller and teller.menu_pdf %}checked{% elif mode=="new" %}checked{% endif %}/> 鑑定PDF（後日送付）</label>
            </div>
          </div>
        </div>

        <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn" type="submit">保存</button>
          <a class="btn2" href="/admin/tellers">戻る</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
