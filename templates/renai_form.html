<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>恋愛占いフォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      margin: 0 auto;
      max-width: 500px;
      padding: 20px;
      background: #f9f9f9;
    }
    h2 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input[type="date"],
    input[type="text"],
    button {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-top: 5px;
    }
    .submit-area {
      margin-top: 20px;
      text-align: center;
    }
    /* 追加：表示用のスタイル */
    .profile-display {
      font-size: 0.95rem;
      color: #444;
      margin: 6px 0 10px;
      line-height: 1.4;
    }
    .muted {
      color: #666;
      font-size: 0.9rem;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <h2>💘 恋愛占いフォーム</h2>

  <!-- 既存フォーム（送信処理はそのまま） -->
  <form method="POST" onsubmit="disableSubmitButton()">
    <label for="user_birth">あなたの生年月日</label>
    <input type="date" id="user_birth" name="user_birth" required>
    <!-- 追加：あなた表示 -->
    <div id="you-eto" class="profile-display"></div>
    <div id="you-zodiac" class="profile-display muted"></div>

    <label for="partner_birth">お相手の生年月日(任意)</label>
    <input type="date" id="partner_birth" name="partner_birth">
    <!-- 追加：お相手表示 -->
    <div id="partner-eto" class="profile-display"></div>
    <div id="partner-zodiac" class="profile-display muted"></div>

    <label>
      <input type="checkbox" name="include_yearly" value="yes">
      1年分の運勢も見る
    </label>

    <div class="submit-area">
      <button type="submit">🔮 鑑定スタート</button>
    </div>
  </form>

  <div class="submit-area">
    <a href="/tenmob" style="display:inline-block; margin-top:10px;">🔙 手相鑑定に戻る</a>
  </div>

  <script>
    // 既存：送信ボタンの二重送信防止（元ファイルのまま）
    function disableSubmitButton() {
      const btn = document.querySelector("button[type='submit']");
      btn.disabled = true;
      btn.textContent = "鑑定中... 1分程度お待ちください";
    }

    // ===== 追加：星座（12星座）判定 =====
    function getZodiacSign(month, day) {
      if ((month===3 && day>=21) || (month===4 && day<=19)) return "牡羊座";
      if ((month===4 && day>=20) || (month===5 && day<=20)) return "牡牛座";
      if ((month===5 && day>=21) || (month===6 && day<=21)) return "双子座";
      if ((month===6 && day>=22) || (month===7 && day<=22)) return "蟹座";
      if ((month===7 && day>=23) || (month===8 && day<=22)) return "獅子座";
      if ((month===8 && day>=23) || (month===9 && day<=22)) return "乙女座";
      if ((month===9 && day>=23) || (month===10 && day<=23)) return "天秤座";
      if ((month===10 && day>=24) || (month===11 && day<=22)) return "蠍座";
      if ((month===11 && day>=23) || (month===12 && day<=21)) return "射手座";
      if ((month===12 && day>=22) || (month===1 && day<=20)) return "山羊座";
      if ((month===1 && day>=21) || (month===2 && day<=18)) return "水瓶座";
      if ((month===2 && day>=19) || (month===3 && day<=20)) return "魚座";
      return "";
    }

    // ===== 追加：干支→番号→60動物 =====
    // （手相フォーム index.html と同じ定義に合わせています）
    const etoOrderMap = {"甲子":1,"乙丑":2,"丙寅":3,"丁卯":4,"戊辰":5,"己巳":6,"庚午":7,"辛未":8,"壬申":9,"癸酉":10,"甲戌":11,"乙亥":12,"丙子":13,"丁丑":14,"戊寅":15,"己卯":16,"庚辰":17,"辛巳":18,"壬午":19,"癸未":20,"甲申":21,"乙酉":22,"丙戌":23,"丁亥":24,"戊子":25,"己丑":26,"庚寅":27,"辛卯":28,"壬辰":29,"癸巳":30,"甲午":31,"乙未":32,"丙申":33,"丁酉":34,"戊戌":35,"己亥":36,"庚子":37,"辛丑":38,"壬寅":39,"癸卯":40,"甲辰":41,"乙巳":42,"丙午":43,"丁未":44,"戊申":45,"己酉":46,"庚戌":47,"辛亥":48,"壬子":49,"癸丑":50,"甲寅":51,"乙卯":52,"丙辰":53,"丁巳":54,"戊午":55,"己未":56,"庚申":57,"辛酉":58,"壬戌":59,"癸亥":60};

    const animal60 = [
      "長距離ランナーのチータ","社交家のたぬき","落ち着きのない猿","フットワークの軽い子守熊","面倒見のいい黒ひょう",
      "愛情あふれる虎","全力疾走するチータ","磨き上げられたたぬき","大きな志をもった猿","母性豊かな子守熊",
      "正直なこじか","人気者のゾウ","ネアカの狼","協調性のないひつじ","どっしりとした猿","コアラのなかの子守熊",
      "強い意志をもったこじか","デリケートなゾウ","放浪の狼","物静かなひつじ","落ち着きのあるペガサス",
      "強靭な翼をもつペガサス","無邪気なひつじ","クリエイティブな狼","穏やかな狼","粘り強いひつじ",
      "波乱に満ちたペガサス","優雅なペガサス","チャレンジ精神旺盛なひつじ","順応性のある狼",
      "リーダーとなるゾウ","しっかり者のこじか","活動的な子守熊","気分屋の猿","頼られると嬉しいひつじ",
      "好感のもたれる狼","まっしぐらに突き進むゾウ","華やかなこじか","夢とロマンの子守熊","尽す猿",
      "大器晩成のたぬき","足腰の強いチータ","動きまわる虎","情熱的な黒ひょう","サービス精神旺盛な子守熊",
      "守りの猿","人間味あふれるたぬき","品格のあるチータ","ゆったりとした悠然の虎","落ち込みの激しい黒ひょう",
      "我が道を行くライオン","統率力のあるライオン","感情豊かな黒ひょう","楽天的な虎","パワフルな虎",
      "気どらない黒ひょう","感情的なライオン","傷つきやすいライオン","束縛を嫌う黒ひょう","慈悲深い虎"
    ];

    // ===== 追加：表示更新（天中殺は表示しない） =====
    async function updateProfileDisplays(dateStr, who) {
      const etoEl = document.getElementById(`${who}-eto`);
      const zodEl = document.getElementById(`${who}-zodiac`);
      if (!etoEl || !zodEl) return;

      if (!dateStr) {
        etoEl.textContent = "";
        zodEl.textContent = "";
        return;
      }

      // 星座
      const [y, m, d] = dateStr.split("-").map(Number);
      const zodiac = getZodiacSign(m, d);
      zodEl.textContent = `${who === "you" ? "あなた" : "お相手"}の星座：${zodiac}`;

      // 干支・本命星・動物（サーバーに /get_eto を問い合わせ）
      try {
        const res = await fetch("/get_eto", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ birthdate: dateStr })
        });
        const data = await res.json();

        if (!res.ok || !data.eto || !data.honmeisei) {
          etoEl.textContent = "⚠️ 情報の取得に失敗しました";
          return;
        }

        const number = etoOrderMap[data.eto];
        const animal = animal60[(number || 1) - 1] || "";
        // ※天中殺（空亡）は表示しません
        etoEl.textContent =
          `${who === "you" ? "あなた" : "お相手"}の干支：${data.eto}（${number}番）／ 動物占い：${animal} ／ 本命星：${data.honmeisei}`;
      } catch (e) {
        etoEl.textContent = "⚠️ 通信エラー: " + e.message;
      }
    }

    // 入力イベントに紐付け（既存フォームへ非干渉）
    const youInput = document.getElementById("user_birth");
    const partnerInput = document.getElementById("partner_birth");
    if (youInput) {
      youInput.addEventListener("input", () => updateProfileDisplays(youInput.value, "you"));
      // ページ読み込み時に値があれば即反映
      if (youInput.value) updateProfileDisplays(youInput.value, "you");
    }
    if (partnerInput) {
      partnerInput.addEventListener("input", () => updateProfileDisplays(partnerInput.value, "partner"));
      if (partnerInput.value) updateProfileDisplays(partnerInput.value, "partner");
    }
  </script>
</body>
</html>
