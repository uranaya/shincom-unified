<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FC請求先マスタ</title><style>body{font-family:system-ui,sans-serif;max-width:650px;margin:30px auto;padding:0 16px}label{display:block;margin:13px 0 4px}input,textarea{padding:10px;box-sizing:border-box;width:100%;font:inherit}button{margin-top:20px;padding:12px 24px;border:0;border-radius:6px;color:white;background:#1565c0;cursor:pointer}</style></head><body><h1>{{ '請求先を編集' if customer else '請求先を登録' }}</h1><a href="{{ url_for('fc.index') }}">← 請求一覧へ</a><form method="post"><input type="hidden" name="_csrf" value="{{ token }}"><input type="hidden" name="id" value="{{ customer.id if customer else '' }}"><label>FC加盟店／請求先名称 *</label><input name="name" required value="{{ customer.name if customer else '' }}"><label>担当者</label><input name="contact_name" value="{{ customer.contact_name if customer else '' }}"><label>郵便番号</label><input name="postal_code" value="{{ customer.postal_code if customer else '' }}"><label>住所</label><textarea name="address" rows="3">{{ customer.address if customer else '' }}</textarea><label>メール</label><input type="email" name="email" value="{{ customer.email if customer else '' }}"><label>電話</label><input name="phone" value="{{ customer.phone if customer else '' }}"><label>メモ</label><textarea name="note" rows="3">{{ customer.note if customer else '' }}</textarea><label><input type="checkbox" name="active" style="width:auto" {% if not customer or customer.active %}checked{% endif %}>有効（請求先選択に表示する）</label><p>ロイヤリティ率：20%（固定）</p><button type="submit">保存する</button></form></body></html>
