<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>スタッフページ ログイン</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,Arial,sans-serif;margin:0;background:#f6f7fb;color:#111}
    .wrap{max-width:520px;margin:0 auto;padding:24px}
    .card{background:#fff;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:22px}
    h1{font-size:18px;margin:0 0 14px}
    label{display:block;font-size:13px;margin:12px 0 6px;color:#444}
    input{width:100%;padding:12px 12px;border:1px solid #d7dbe3;border-radius:10px;font-size:16px;box-sizing:border-box}
    button{width:100%;margin-top:16px;padding:12px 14px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;background:#111;color:#fff}
    .hint{font-size:12px;color:#666;margin-top:10px}
    .err{margin-top:12px;background:#ffe8e8;border:1px solid #ffb3b3;color:#a10000;padding:10px 12px;border-radius:10px;font-size:13px}
    .brand{font-size:12px;color:#666;margin:0 0 10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">占いの館うらなや / Shincom Unified</div>
    <div class="card">
      <h1>スタッフページ ログイン</h1>

      {% if error %}
        <div class="err">{{ error }}</div>
      {% endif %}

      <form method="post" action="/staff/login?next={{ next_url|urlencode }}">
        <label>ユーザー名</label>
        <input name="username" autocomplete="username" required />
        <label>パスワード</label>
        <input name="password" type="password" autocomplete="current-password" required />
        <button type="submit">ログイン</button>
      </form>

      <div class="hint">
        ※ 店内スタッフ向けページです。パスワードが分からない場合は管理者へ連絡してください。
      </div>
    </div>
  </div>
</body>
</html>
