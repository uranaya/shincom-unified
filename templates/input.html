<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>売上入力</title>
  <style>
    body {
      font-family: sans-serif;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      max-width: 500px;
      margin: auto;
    }
    label, select, input, button {
      display: block;
      width: 100%;
      margin-bottom: 15px;
      font-size: 16px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h2>売上入力</h2>

  {% if success %}
    <script>
      alert("✅ 登録が完了しました");
    </script>
  {% endif %}

  <form method="post">
    <label>店員名:</label>
    <select name="staff">
      {% for s in staff_list %}
        <option value="{{ s }}">{{ s }}</option>
      {% endfor %}
    </select>

    <label>鑑定方法:</label>
    <select name="method">
      {% for m in method_list %}
        <option value="{{ m }}">{{ m }}</option>
      {% endfor %}
    </select>

    <label>金額:</label>
    <input type="number" name="amount">

    <button type="submit">登録</button>
  </form>
</body>
</html>
