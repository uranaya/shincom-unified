<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ month }} {{ staff }} 請求書</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
      max-width: 700px;
      margin: auto;
      font-size: 16px;
      line-height: 1.6;
    }
    h2 {
      margin-bottom: 20px;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: right;
    }
    th {
      background-color: #f0f0f0;
      text-align: center;
    }
    .total-row td {
      font-weight: bold;
      font-size: 18px;
      background-color: #f9f9f9;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    @media print {
      button { display: none; }
    }
  </style>
</head>
<body>
  <h2>{{ month }} {{ staff }} 請求書</h2>

  <table>
    <tr>
      <th>項目</th>
      <th>金額 (円)</th>
    </tr>
    <tr>
      <td style="text-align:left;">対面売上合計</td>
      <td>{{ total_taiken }}</td>
    </tr>
    <tr>
      <td style="text-align:left;">コンピューター売上合計</td>
      <td>{{ total_pc }}</td>
    </tr>
    <tr>
      <td style="text-align:left;">現金外合計</td>
      <td>{{ total_cashless }}</td>
    </tr>
    <tr>
      <td style="text-align:left;">出店料（税抜）</td>
      <td>{{ store_fee | round(0) }}</td>
    </tr>
    <tr>
      <td style="text-align:left;">出店料（税込10％）</td>
      <td>{{ store_fee_tax }}</td>
    </tr>
    <tr class="total-row">
      <td style="text-align:left;">請求額（現金外差引後）</td>
      <td>{{ final_invoice }}</td>
    </tr>
  </table>

  <button onclick="window.location.href='/admin/invoice_staff_special_pdf?month={{ month }}&staff={{ staff }}'">特別出店料（PDF）</button>
  <button onclick="window.location.href='/admin/invoice_staff_pdf?month={{ month }}&staff={{ staff }}'">
    通常PDF出力
  </button>


</body>
</html>
